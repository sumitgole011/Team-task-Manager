{% extends 'base.html' %}{% block content %}
<section class="auth-card">
  <h1>Signup</h1><p>Create a Member account. Administrator access is provisioned separately.</p>
  <form method="post">
    <label>Name</label><input name="name" required>
    <label>Email</label><input name="email" type="email" required>
    <label>Password</label><input name="password" type="password" minlength="6" required>
    <button class="btn full">Create account</button>
  </form>
  <p>Already have account? <a href="{{ url_for('login') }}">Login</a></p>
</section>
{% endblock %}
