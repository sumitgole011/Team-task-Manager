name: Python security tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONWARNINGS: "always::ResourceWarning"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SQLite test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Flask==3.0.3 Flask-SQLAlchemy==3.1.1 Werkzeug==3.0.3 python-dotenv==1.0.1

      - name: Run signup security regression tests
        run: python -W always::ResourceWarning -m unittest discover -s tests -v
